<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <title>MyTube</title>
  <!-- Pixel pizza slice, as specified in DESIGN.md (Icon). Colours live only here. -->
  <!-- Crust: dark, crust, highlight -->
  <rect x="2" y="1" width="12" height="1" fill="#8A4F1C"/>
  <rect x="1" y="2" width="14" height="2" fill="#B5712E"/>
  <rect x="2" y="2" width="11" height="1" fill="#D9964A"/>
  <!-- Cheese -->
  <rect x="2" y="4" width="12" height="1" fill="#F5C542"/>
  <rect x="3" y="5" width="10" height="2" fill="#F5C542"/>
  <rect x="4" y="7" width="8" height="1" fill="#F5C542"/>
  <rect x="5" y="8" width="6" height="2" fill="#F5C542"/>
  <rect x="6" y="10" width="4" height="1" fill="#F5C542"/>
  <rect x="7" y="11" width="2" height="2" fill="#F5C542"/>
  <!-- Cheese shade (right edge) -->
  <rect x="12" y="5" width="1" height="2" fill="#E0A92E"/>
  <rect x="11" y="7" width="1" height="1" fill="#E0A92E"/>
  <rect x="10" y="8" width="1" height="2" fill="#E0A92E"/>
  <rect x="9" y="10" width="1" height="1" fill="#E0A92E"/>
  <rect x="8" y="11" width="1" height="2" fill="#E0A92E"/>
  <!-- Pepperoni -->
  <rect x="4" y="5" width="2" height="2" fill="#C2352B"/>
  <rect x="9" y="5" width="2" height="1" fill="#C2352B"/>
  <rect x="9" y="6" width="1" height="1" fill="#C2352B"/>
  <rect x="6" y="8" width="2" height="1" fill="#C2352B"/>
  <rect x="7" y="9" width="1" height="1" fill="#C2352B"/>
  <!-- Drips -->
  <rect x="3" y="7" width="1" height="3" fill="#F5C542"/>
  <rect x="12" y="7" width="1" height="2" fill="#F5C542"/>
  <rect x="5" y="10" width="1" height="2" fill="#F5C542"/>
  <rect x="7" y="13" width="1" height="2" fill="#F5C542"/>
  <!-- Drip tips -->
  <rect x="3" y="10" width="1" height="1" fill="#E0A92E"/>
  <rect x="7" y="15" width="1" height="1" fill="#E0A92E"/>
</svg>
